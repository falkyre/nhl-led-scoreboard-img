name: Build Pi-Gen Image optimized

on:
  push:
    branches:
      - 'fix/trixie-misc'

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      run_type:
        description: 'Run type: "Test" or "Release"'
        required: true
        default: 'Test'
        type: choice
        options:
        - Test
        - Release

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'release' && (startsWith(github.event.release.tag_name, 'v') || startsWith(github.event.release.tag_name, 'V')))
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get the version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            if [[ $VERSION == v* ]]; then
              VERSION=${VERSION:1}
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=TESTVERSION" >> $GITHUB_OUTPUT
          fi

      - name: Enable Docker
        run: docker --version

      - name: Cache Apt Packages
        uses: actions/cache@v4
        with:
          path: .apt-cache
          key: apt-cache-${{ hashFiles('pi-gen-config/config') }}
          restore-keys: |
            apt-cache-

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: .pip-cache
          key: pip-cache-${{ hashFiles('nhl-image/ansible/requirements.txt') }}
          restore-keys: |
            pip-cache-

      - name: Create Cache Directories
        run: |
          mkdir -p .apt-cache
          mkdir -p .pip-cache

      - name: Start apt-cacher-ng proxy
        run: |
          docker run -d -p 3142:3142 \
            -v $(pwd)/.apt-cache:/var/cache/apt-cacher-ng \
            --name apt-cacher-ng \
            sameersbn/apt-cacher-ng:latest

      - name: Configure APT Proxy
        run: |
          DOCKER_GATEWAY=$(docker network inspect bridge --format='{{(index .IPAM.Config 0).Gateway}}')
          echo "Setting APT_PROXY to http://$DOCKER_GATEWAY:3142"
          echo "APT_PROXY='http://$DOCKER_GATEWAY:3142'" >> pi-gen-config/config

      - name: Build Image
        env:
          USE_DOCKER: true
          # Force the build to target the Raspberry Pi 3/Zero 2W baseline 
          # despite being on a high-performance GitHub runner
          EXTRA_CXXFLAGS: "-march=armv8-a -mtune=cortex-a53"
          HARDWARE_DESC: "regular"
        run: |
          chmod +x build-image.sh
          ./build-image.sh

      - name: Rename compressed image to include version
        run: |
          ls -lh pi-gen/deploy/
          SOURCE_FILE=$(ls pi-gen/deploy/*.gz | head -n 1)
          mv "$SOURCE_FILE" "rpios-scoreboard-${{ steps.get_version.outputs.version }}.img.gz"

      - name: Create changelog text
        if: startsWith(github.ref, 'refs/tags/')
        id: changelog
        uses: loopwerk/tag-changelog@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          exclude_types: other,doc,chore

      - name: Upload image artifact for testing
        if: github.event.inputs.run_type == 'Test' || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: rpios-scoreboard-${{ steps.get_version.outputs.version }}.img
          path: rpios-scoreboard-${{ steps.get_version.outputs.version }}.img.gz

      - name: GH Release
        if: github.event.inputs.run_type == 'Release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v0.1.15
        with:
          prerelease: true
          generate_release_notes: true
          body: ${{ steps.changelog.outputs.changes }}
          files: rpios-scoreboard-${{ steps.get_version.outputs.version }}.img.gz