name: Create Release - Dietpi Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      run_type:
        description: 'Run type: "Test" or "Release"'
        required: true
        default: 'Test'
        type: choice
        options:
        - Test
        - Release

# Permissions required to create releases and upload artifacts
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && (startsWith(github.event.release.tag_name, 'v') || startsWith(github.event.release.tag_name, 'V')))

    steps:
    - uses: actions/checkout@v4

    - name: Cache Pip Packages
      uses: actions/cache@v4
      with:
        path: pip-cache
        key: pip-cache-bookworm-${{ hashFiles('.github/workflows/dietpi-release.yml') }}
        restore-keys: |
          pip-cache-bookworm-

    - name: Cache Apt Packages
      uses: actions/cache@v4
      with:
        path: apt-cache
        key: apt-cache-bookworm-${{ hashFiles('.github/workflows/dietpi-release.yml') }}
        restore-keys: |
          apt-cache-bookworm-

    - name: Create Cache Directories
      run: mkdir -p pip-cache apt-cache

    # 1. SETUP QEMU
    # This installs the ARM emulators into the kernel.
    # It allows the standard x86 runner to execute ARM binaries transparently.
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Get the version
      id: get_version
      run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            if [[ $VERSION == v* ]]; then
              VERSION=${VERSION:1}
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=TESTVERSION" >> $GITHUB_OUTPUT
          fi

    # 2. BUILD THE IMAGE
    # We use 'docker run' with --privileged to allow loopback mounting.
    # We install 'qemu-user-static' inside the container before running the script
    # to ensure the chroot environment has the necessary interpreters.
    - name: Build DietPi Image
      run: |
        docker run --rm --privileged \
          -v ${{ github.workspace }}:/build \
          -v ${{ github.workspace }}/apt-cache:/var/cache/apt/archives \
          -v ${{ github.workspace }}/pip-cache:/root/.cache/pip \
          -v /dev:/dev \
          -w /build/nhl-image \
          debian:bookworm \
          bash -c "rm -f /etc/apt/apt.conf.d/docker-clean && echo 'Binary::apt::APT::Keep-Downloaded-Packages \"true\";' > /etc/apt/apt.conf.d/keep-cache && apt-get update && apt-get install -y qemu-user-static && bash bootstrap-local.sh"

    # 3. VERIFY OUTPUT
    - name: Check Build Output
      run: |
        ls -lh nhl-image/nhl-scoreboard-dietpi.img.xz

    # 4. RENAME ARTIFACT
    - name: Rename compressed image to include version
      run: |
        mv nhl-image/nhl-scoreboard-dietpi.img.xz dietpi-scoreboard-${{ steps.get_version.outputs.version }}.img.xz

    # 5. GENERATE CHANGELOG
    - name: Create changelog text
      id: changelog
      uses: loopwerk/tag-changelog@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        exclude_types: other,doc,chore

    # 6. UPLOAD ARTIFACT (Test Mode)
    - name: Upload image artifact for testing
      if: github.event.inputs.run_type == 'Test'
      uses: actions/upload-artifact@v4
      with:
        name: dietpi-scoreboard-${{ steps.get_version.outputs.version }}
        path: dietpi-scoreboard-${{ steps.get_version.outputs.version }}.img.xz

    # 7. CREATE RELEASE (Release Mode or Tag Push)
    - name: GH Release
      if: github.event.inputs.run_type == 'Release' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
      uses: softprops/action-gh-release@v1
      with:
        prerelease: true
        generate_release_notes: true
        body: ${{ steps.changelog.outputs.changes }}
        files: dietpi-scoreboard-${{ steps.get_version.outputs.version }}.img.xz

    # 8. FIX CACHE PERMISSIONS
    - name: Fix Cache Permissions
      if: always()
      run: sudo chown -R $USER pip-cache apt-cache