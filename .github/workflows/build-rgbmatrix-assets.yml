name: Build RGB Matrix Assets (Trixie)

on:
  workflow_dispatch:
  push:
    paths:
      - 'submodules/rpi-rgb-led-matrix/**'
      - '.github/workflows/build-rgbmatrix-assets.yml'

permissions:
  contents: write

jobs:
  build_trixie:
    name: Build Trixie Assets (Py3.13 / arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Apt Packages
        uses: actions/cache@v4
        with:
          path: apt-cache
          key: apt-cache-trixie-${{ hashFiles('.github/workflows/build-rgbmatrix-assets.yml') }}
          restore-keys: |
            apt-cache-trixie-

      - name: Create Cache Directory
        run: mkdir -p apt-cache

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Build in Trixie Container
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/work \
            -v ${{ github.workspace }}/apt-cache:/var/cache/apt/archives \
            debian:trixie \
            /bin/bash -c '
            set -e

            # --- 1. SETUP ENVIRONMENT ---
            # Added "+nosve" to ensure the compiler doesn"t generate instructions
            # that will crash the Pi Zero 2 W (Cortex-A53).
            SAFE_FLAGS="-march=armv8-a+nosve -mtune=cortex-a53 -D_GLIBCXX_USE_CXX11_ABI=1"
            HARDWARE_DESC="regular"
            
            export CFLAGS="$SAFE_FLAGS"
            export CXXFLAGS="$SAFE_FLAGS"
            export HARDWARE_DESC="$HARDWARE_DESC"

            # --- 2. INSTALL DEPENDENCIES ---
            rm -f /etc/apt/apt.conf.d/docker-clean
            echo "Binary::apt::APT::Keep-Downloaded-Packages \"true\";" > /etc/apt/apt.conf.d/keep-cache
            
            apt-get update && apt-get install -y \
              build-essential \
              python3-full \
              python3-dev \
              python3-pip \
              python3-pillow \
              python3-setuptools \
              python3-wheel \
              cython3 \
              libgraphicsmagick++-dev \
              libwebp-dev \
              git \
              wget \
              curl \
              grep

            # --- 3. PILLOW HEADER FIX ---
            echo "Fetching Pillow source..."
            PILLOW_URL=$(curl -s https://pypi.org/pypi/Pillow/json | grep -o "https://[^\"]*tar.gz" | head -n 1)
            mkdir -p /tmp/pillow-src
            wget -qO- $PILLOW_URL | tar xz -C /tmp/pillow-src
            PILLOW_INCLUDE=$(find /tmp/pillow-src -type d -name libImaging | head -n 1)
            export CFLAGS="$CFLAGS -I$PILLOW_INCLUDE"

            # --- 4. PATCH MAKEFILES ---
            # We use absolute path to ensure we are in the right place
            cd /work/submodules/rpi-rgb-led-matrix
            
            # Clean first to ensure no bad artifacts exist
            make clean
            make -C lib clean

            # A. Remove "native" detection lines
            sed -i "/-march=native/d" lib/Makefile
            sed -i "/-march=native/d" utils/Makefile

            # B. Force CXXFLAGS at the top of the file
            sed -i "s|^CXXFLAGS\s*=|CXXFLAGS=$SAFE_FLAGS |g" lib/Makefile
            sed -i "s|^CXXFLAGS\s*=|CXXFLAGS=$SAFE_FLAGS |g" utils/Makefile

            # C. Patch setup.py
            sed -i "s/-march=native/-march=armv8-a/g" bindings/python/setup.py
            sed -i "s/-mtune=native/-mtune=cortex-a53/g" bindings/python/setup.py

            # --- 5. BUILD CORE LIBRARY ---
            # Using Absolute Path logic implicitly by staying in the repo root
            make -C lib HARDWARE_DESC=regular

            # --- 6. BUILD PYTHON WHEEL ---
            # FIX: Use Absolute Path to prevent "No such file" error
            cd /work/submodules/rpi-rgb-led-matrix/bindings/python
            
            cython3 --cplus -3 rgbmatrix/core.pyx
            cython3 --cplus -3 rgbmatrix/graphics.pyx
            
            echo "[build-system]
            requires = [\"setuptools>=42\", \"wheel\", \"Cython\"]
            build-backend = \"setuptools.build_meta\"
            
            [project]
            name = \"rgbmatrix\"
            version = \"0.0.1\"
            description = \"Python bindings\"
            readme = \"README.md\"
            requires-python = \">=3.11\"
            dependencies = [\"Pillow\"]" > pyproject.toml

            pip install build --break-system-packages
            python3 -m build --wheel --no-isolation --outdir /work/dist

            # --- 7. BUILD UTILITY ---
            # FIX: Use Absolute Path to return to root
            cd /work/submodules/rpi-rgb-led-matrix
            
            make -C utils led-image-viewer HARDWARE_DESC=regular
            cp utils/led-image-viewer /work/dist/
            '

      - name: Fix Cache Permissions
        if: always()
        run: sudo chown -R $USER apt-cache

      - name: Delete Old Release
        uses: dev-drprasad/delete-tag-and-release@v1.0
        with:
          tag_name: latest-trixie
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true

      - name: Publish Assets
        uses: softprops/action-gh-release@v1
        with:
          name: "Latest Trixie (Py3.13) Assets"
          tag_name: latest-trixie
          files: |
            dist/*.whl
            dist/led-image-viewer
          prerelease: true