name: Build RGB Matrix Assets (Trixie)

on:
  workflow_dispatch:
  push:
    paths:
      - 'submodules/rpi-rgb-led-matrix/**'
      - '.github/workflows/build-rgbmatrix-assets.yml'

permissions:
  contents: write

jobs:
  build_trixie:
    name: Build Trixie Assets (Py3.13 / arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Build in Trixie Container
        # REPLACED: We now run docker directly to avoid API version conflicts
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/work \
            debian:trixie \
            /bin/bash -c '
            set -e  # Fail on error

            # --- DEFINE FLAGS ---
            SAFE_FLAGS="-march=armv8-a -mtune=cortex-a53 -D_GLIBCXX_USE_CXX11_ABI=1"
            HARDWARE_DESC="regular"
            
            export CFLAGS="$SAFE_FLAGS"
            export CXXFLAGS="$SAFE_FLAGS"
            export HARDWARE_DESC="$HARDWARE_DESC"

            # --- PATCHING ---
            cd /work/submodules/rpi-rgb-led-matrix
            
            sed -i "s|^CXXFLAGS=|CXXFLAGS=$SAFE_FLAGS |g" lib/Makefile
            sed -i "s|^CXXFLAGS=|CXXFLAGS=$SAFE_FLAGS |g" utils/Makefile
            sed -i "s|^HARDWARE_DESC=.*|HARDWARE_DESC=$HARDWARE_DESC|g" lib/Makefile

            # --- DEPENDENCIES ---
            apt-get update && apt-get install -y \
              build-essential \
              python3-full \
              python3-dev \
              python3-pip \
              cython3 \
              libgraphicsmagick++-dev \
              libwebp-dev \
              git

            # --- BUILD WHEEL ---
            cd bindings/python
            
            echo "[build-system]
            requires = [\"setuptools>=42\", \"wheel\", \"Cython\"]
            build-backend = \"setuptools.build_meta\"
            
            [project]
            name = \"rgbmatrix\"
            version = \"0.0.1\"
            description = \"Python bindings\"
            readme = \"README.md\"
            requires-python = \">=3.11\"
            dependencies = [\"Pillow\"]" > pyproject.toml

            pip install build --break-system-packages
            python3 -m build --wheel --outdir /work/dist

            # --- BUILD UTILITY ---
            cd /work/submodules/rpi-rgb-led-matrix
            make -C utils led-image-viewer
            cp utils/led-image-viewer /work/dist/
            '

      - name: Delete Old Release
        uses: dev-drprasad/delete-tag-and-release@v1.0
        with:
          tag_name: latest-trixie
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true

      - name: Publish Assets
        uses: softprops/action-gh-release@v1
        with:
          name: "Latest Trixie (Py3.13) Assets"
          tag_name: latest-trixie
          files: |
            dist/*.whl
            dist/led-image-viewer
          prerelease: true