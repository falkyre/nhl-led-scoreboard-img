---
- name: Setup RPi - Scoreboard setup
  hosts: all
  become: true
  become_user: root
  vars:
    keyboard_keymap: "us"
    timezone: "America/Toronto"
    locale: en_US.UTF-8
    wifi_country: CA
    gh_repo: "https://github.com/falkyre/nhl-led-scoreboard.git"
    # Repo where the compiled assets (wheel/viewer) are stored
    assets_repo: "falkyre/nhl-led-scoreboard-img"
    use_beta: false
    gh_branch: "2026.x.x-beta"
    system_hostname: scoreboard
    apt_proxy: ""
    use_apt_proxy: false
    pypi_proxy: ""
    imgver: "{{ lookup('file', 'VERSION').splitlines()[0].split(':')[-1] }}"

  tasks:
    - name: Setup apt proxy
      ansible.builtin.copy:
        src: ./files/sb_image/51cache
        dest: /etc/apt/apt.conf.d/
        mode: "0644"
      when: use_apt_proxy

    - name: Update apt proxy in 51cache file
      ansible.builtin.replace:
        path: /etc/apt/apt.conf.d/51cache
        regexp: 'APT_PROXY'
        replace: "{{ apt_proxy }}"
      when: use_apt_proxy

    - name: Install git and build essential
      ansible.builtin.apt:
        name:
          - git
          - build-essential
        update_cache: yes
        state: present

    - name: Disable SSH rename user message
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/rename_user.conf
        state: absent

    - name: Add temporary password for root user
      ansible.builtin.user:
        name: root
        password: "{{ 'letiretlebut' | password_hash('sha512') }}"

    - name: Blacklist snd_bcm module
      ansible.builtin.copy:
        dest: /etc/modprobe.d/blacklist-rgb-matrix.conf
        content: |
          blacklist snd_bcm2835
        mode: "0644"

    - name: Copy global bash.bashrc
      ansible.builtin.copy:
        src: ./files/sb_image/bash.bashrc
        dest: /etc/
        mode: "0644"

    - name: Copy scoreboard.bash to bashrc.d
      ansible.builtin.copy:
        src: ./files/sb_image/scoreboard.bash
        dest: /etc/bashrc.d/
        mode: "0644"

    - name: Setup cron.scoreboard
      ansible.builtin.copy:
        src: ./files/sb_image/get_version
        dest: /etc/cron.scoreboard
        mode: "0755"

    - name: Setup crontab
      ansible.builtin.copy:
        src: ./files/sb_image/crontab
        dest: /etc/
        backup: true
        mode: preserve

    - name: Setup pi user crontab for updates
      ansible.builtin.cron:
        user: pi
        name: "Check scoreboard version"
        minute: 0
        hour: 3
        job: "/home/pi/sbtools/checkUpdate.sh > /home/pi/.nhlledportal/status"

    - name: Install aptfile
      ansible.builtin.copy:
        src: ./files/sb_image/aptfile
        dest: /usr/local/bin
        mode: "0755"

    - name: Install OS packages needed for scoreboard
      ansible.builtin.apt:
        name:
          - cmake
          - cython3
          - python3-pip
          - python3-cairosvg
          - python3-dev
          - python3-setuptools
          - python3-numpy
          - python3-pandas
          - python3-pil
          - python3-pygame
          - python3-tk
          - python3-gpiozero
          - python3-virtualenv
          - python3-venv
          - supervisor
          - pastebinit
          - fastfetch
          - jq
          - curl  # Added curl for API queries
          - neovim
          - zsh
          - direnv
          - libwebp-dev
          - dbus
          - libsixel-bin
          - libgraphicsmagick++-q16-12
          - libgraphicsmagick++-dev
        state: present

    - name: Remove OS packages that will cause issues
      ansible.builtin.apt:
        name:
          - bluez
          - bluez-firmware
          - pi-bluetooth
          - triggerhappy
        clean: true
        state: absent

    - name: Enable NetworkManager service
      ansible.builtin.systemd:
        name: NetworkManager
        enabled: true

    - name: Disable Supervisor service
      ansible.builtin.systemd:
        name: supervisor
        enabled: false

    - name: Disable and mask services for comitup
      ansible.builtin.systemd:
        name: "{{ item }}"
        masked: true
      with_items:
        - dhcpcd
        - dnsmasq
        - systemd-resolved
        - dhcpd
        - wpa-supplicant
        - NetworkManager-wait-online

    - name: Delete network interfaces file
      ansible.builtin.file:
        path: /etc/network/interface
        state: absent

    - name: Install comitup source repo
      ansible.builtin.apt:
        deb: https://davesteele.github.io/comitup/deb/davesteele-comitup-apt-source_1.3_all.deb
        dpkg_options: "force-all"

    - name: Install comitup and comitup-watch
      ansible.builtin.apt:
        update_cache: yes
        name:
          - comitup
          - comitup-watch

    - name: Copy scoreboard comitup.conf
      ansible.builtin.copy:
        src: ./files/comitup-conf/comitup.conf
        dest: /etc/
        mode: "0755"

    - name: Extract scoreboard template
      ansible.builtin.unarchive:
        src: ./files/comitup-conf/scoreboard_ui.tar.gz
        dest: /usr/share/comitup/web/templates

    - name: Update template path in comitupweb.py
      ansible.builtin.lineinfile:
        path: /usr/share/comitup/web/comitupweb.py
        regexp: '^TEMPLATE_PATH ='
        line: 'TEMPLATE_PATH = "/usr/share/comitup/web/templates/scoreboard"'

    - name: Install nls-controlhub source repo
      ansible.builtin.apt:
        deb: https://falkyre.github.io/nhl-setup/repo/nls-controlhub-apt-source_2026.02.0_all.deb
        dpkg_options: "force-all"

    - name: Install nls-controlhub
      ansible.builtin.apt:
        update_cache: yes
        name: nls-controlhub

    - name: Copy nls_controlhub config
      ansible.builtin.copy:
        src: "./files/sb_image/nls_controlhub_cfg.toml"
        dest: "/etc/nls_controlhub/config.toml"
        mode: "0644"

    - name: Install and enable scoreboard services
      ansible.builtin.copy:
        src: "./files/sb_image/{{ item }}"
        dest: /etc/systemd/system
        mode: "0644"
      with_items:
        - sb_splash.service
        - sb_autosettz.service
        - wifi-on.service

    - name: Enable services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
      with_items:
        - sb_splash.service
        - sb_autosettz.service
        - wifi-on.service

    - name: Copy supervisor configs
      ansible.builtin.copy:
        src: "./files/sb_image/{{ item }}"
        dest: "/etc/supervisor/{{ 'conf.d/' if 'scoreboard' in item else '' }}"
        mode: preserve
      with_items:
        - supervisord.conf
        - scoreboard.conf
        - scoreboard-emulated.conf

    - name: Copy sbtools directory
      become: true
      become_user: pi
      ansible.builtin.copy:
        src: ./files/sb_image/sbtools
        dest: ~/
        mode: preserve

    - name: Setup fastfetch and portal directories
      become: true
      become_user: pi
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      with_items:
        - ~/.config/fastfetch
        - ~/.nhlledportal

    - name: Copy fastfetch config
      become: true
      become_user: pi
      ansible.builtin.copy:
        src: ./files/sb_image/.config/fastfetch/config.jsonc
        dest: ~/.config/fastfetch/config.jsonc
        mode: "0755"

    - name: Create portal startup files
      become: true
      become_user: pi
      ansible.builtin.file:
        path: "~/.nhlledportal/{{ item }}"
        state: touch
        mode: "0755"
      with_items:
        - setTZ
        - SETUP

    - name: Put image version in .nhlledportal
      become: true
      become_user: pi
      ansible.builtin.copy:
        dest: ~/.nhlledportal/imgver
        content: 'You are running the image version {{ imgver }}'

    - name: Setup pi user bash and gitconfig
      become: true
      become_user: pi
      ansible.builtin.copy:
        src: "./files/sb_image/{{ item }}"
        dest: ~/
        mode: "0644"
      with_items:
        - .gitconfig
        - .bashrc

    - name: Download scoreboard repo
      become: true
      become_user: pi
      ansible.builtin.git:
        repo: "{{ gh_repo }}"
        dest: ~/nhl-led-scoreboard
        recursive: true
        single_branch: true
        depth: 1
        version: "{{ gh_branch if use_beta else 'HEAD' }}"

    - name: Fetch scoreboard submodules
      become: true
      become_user: pi
      ansible.builtin.command: git submodule update --init --recursive
      args:
        chdir: /home/pi/nhl-led-scoreboard

    - name: Install required python packages
      become: true
      become_user: pi
      ansible.builtin.pip:
        virtualenv: /home/pi/nhlsb-venv
        virtualenv_python: python3
        virtualenv_site_packages: true
        extra_args: "{{ pypi_proxy }}"
        requirements: /home/pi/nhl-led-scoreboard/requirements.txt

    - name: Install extra python packages
      become: true
      become_user: pi
      ansible.builtin.pip:
        virtualenv: /home/pi/nhlsb-venv
        name:
          - pip
          - archey4
          - tzlocal
          - lastversion
          - rich-cli
          - cairosvg

    # --- UPDATED SECTION START ---
    - name: Install RGB Matrix binaries (Viewer & Wheel)
      become: true
      become_user: pi
      shell: |
        # Define API URL for the assets repository
        API_URL="https://api.github.com/repos/{{ assets_repo }}/releases/tags/latest-trixie"
        
        # 1. Fetch URLs for the Wheel and the Viewer using jq
        # We grab the first asset ending in .whl (auto-detects version)
        WHEEL_URL=$(curl -s $API_URL | jq -r '.assets[] | select(.name | endswith(".whl")) | .browser_download_url' | head -n 1)
        # We grab the asset named 'led-image-viewer'
        VIEWER_URL=$(curl -s $API_URL | jq -r '.assets[] | select(.name == "led-image-viewer") | .browser_download_url' | head -n 1)
        
        # 2. Download files
        echo "Downloading Wheel: $WHEEL_URL"
        wget -q -O /tmp/rgbmatrix.whl "$WHEEL_URL"
        
        echo "Downloading Viewer: $VIEWER_URL"
        wget -q -O /home/pi/sbtools/led-image-viewer "$VIEWER_URL"
        
        # 3. Setup Viewer
        chmod +x /home/pi/sbtools/led-image-viewer
        
        # 4. Install Wheel into venv
        # We use the pip inside the venv to ensure it installs there
        /home/pi/nhlsb-venv/bin/pip install /tmp/rgbmatrix.whl --force-reinstall
        
        # 5. Cleanup
        rm -f /tmp/rgbmatrix.whl
      args:
        executable: /bin/bash
      register: rgb_install
      changed_when: "'Successfully installed' in rgb_install.stdout"
    # --- UPDATED SECTION END ---

    - name: Create direnv setup
      become: true
      become_user: pi
      ansible.builtin.copy:
        dest: /home/pi/nhl-led-scoreboard/.envrc
        content: |
          export VIRTUAL_ENV=/home/pi/nhlsb-venv
          source /home/pi/nhlsb-venv/bin/activate
          export PYVER=`python3 -V`
          unset PS1
        mode: "0755"

    - name: Activate direnv
      become: true
      become_user: pi
      ansible.builtin.command: direnv allow ~/nhl-led-scoreboard
      changed_when: false

    - name: Download nhl_setup executable
      become: true
      become_user: pi
      ansible.builtin.get_url:
        url: "https://github.com/falkyre/nhl-setup/releases/latest/download/nhl_setup.{{ '64' if (ansible_architecture == 'aarch64' or ansible_architecture == 'arm64') else '32' }}"
        dest: "/home/pi/nhl-led-scoreboard/nhl_setup"
        mode: '0755'

    - name: Update .nhlledportal/status
      become: true
      become_user: pi
      ansible.builtin.shell: /home/pi/sbtools/checkUpdate.sh > /home/pi/.nhlledportal/status
      args:
        chdir: /home/pi/sbtools
      changed_when: false

    - name: Final cleanup
      ansible.builtin.apt:
        autoclean: true
        autoremove: true
        clean: truen